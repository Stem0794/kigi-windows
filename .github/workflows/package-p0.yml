name: Package macOS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/package-p0.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'resources/**'
      - 'scripts/**'
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust targets
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Check format and targeted tests
        run: |
          if ! cargo fmt --check; then
            cargo fmt
            echo KIGI_FORMAT_PATCH_BEGIN
            git diff --no-color -- src
            echo KIGI_FORMAT_PATCH_END
            exit 1
          fi
          cargo check --locked
          cargo test --locked
      - name: Compile fixed Chrome script when Chrome is installed
        run: |
          if [[ -d "/Applications/Google Chrome.app" ]]; then
            osacompile -o "$RUNNER_TEMP/kigi-chatgpt.scpt" resources/chatgpt.applescript
          else
            echo "Chrome absent on runner: script compilation requires pilot Mac; no Chrome automation executed."
          fi
      - name: Build universal application
        run: bash scripts/bundle.sh universal
      - name: Verify same-bundle relaunch and collect startup RSS
        run: |
          python3 - <<'PYTHON'
          import json, platform, select, subprocess, time
          results = []
          for attempt in range(2):
              app = subprocess.Popen(["dist/Kigi Windows.app/Contents/MacOS/kigi-windows", "--startup-report"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              rows = []
              output = []
              try:
                  deadline = time.monotonic() + 15
                  while time.monotonic() < deadline and not rows:
                      if app.poll() is not None:
                          break
                      readable, _, _ = select.select([app.stdout], [], [], 0.2)
                      if readable:
                          line = app.stdout.readline().decode(errors="replace")
                          output.append(line)
                          if line.startswith("KIGI_STARTUP "):
                              rows.append(json.loads(line.removeprefix("KIGI_STARTUP ")))
                  assert app.poll() is None, "Kigi exited during startup: " + "".join(output)
              finally:
                  if app.poll() is None:
                      app.terminate()
                      try:
                          app.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          app.kill()
                          app.wait()
                  output.append(app.communicate()[0].decode(errors="replace"))
                  print("".join(output))
              assert len(rows) == 1, "Missing native startup evidence"
              row = rows[0]
              assert row["window_visible"], "Settings window did not open"
              assert row["rss_bytes"] > 0 and row["peak_rss_bytes"] > 0
              results.append(row)
          assert results[1]["previous_launch_known"], "Second launch did not see the previous session"
          assert results[0]["accessibility"] == results[1]["accessibility"]
          assert results[0]["input_access"] == results[1]["input_access"]
          print("NATIVE_VALIDATION " + json.dumps({"macOS": platform.mac_ver()[0], "machine": platform.machine(), "launches": results}))
          print("Two same-bundle startups verified; no input or screenshot taken.")
          PYTHON
      - name: Verify focus from maximized and native-fullscreen fixtures
        run: python3 scripts/check-focus.py
      - name: Archive application
        run: |
          lipo -info "dist/Kigi Windows.app/Contents/MacOS/kigi-windows"
          ditto -c -k --sequesterRsrc --keepParent "dist/Kigi Windows.app" dist/Kigi-Windows-macOS-universal.zip
          python3 - <<'PYTHON'
          import hashlib, json, plistlib, struct, zipfile
          from pathlib import Path
          path = Path("dist/Kigi-Windows-macOS-universal.zip")
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              plist = plistlib.loads(archive.read(next(n for n in archive.namelist() if n.endswith("Contents/Info.plist"))))
              assert plist["CFBundleShortVersionString"] == "0.5.4" and plist["CFBundleVersion"] == "19"
              binary = archive.read(next(n for n in archive.namelist() if n.endswith("Contents/MacOS/kigi-windows")))
              assert struct.unpack(">II", binary[:8]) == (0xcafebabe, 2)
              assert {struct.unpack(">I", binary[8+i*20:12+i*20])[0] for i in range(2)} == {0x1000007, 0x100000c}
          print("KIGI_PACKAGE " + json.dumps({"version": plist["CFBundleShortVersionString"], "bytes": path.stat().st_size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: Kigi-Windows-macOS-universal
          path: dist/Kigi-Windows-macOS-universal.zip
          if-no-files-found: error
          retention-days: 14
