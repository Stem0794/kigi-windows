name: Package macOS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/package-p0.yml'
      - 'Cargo.toml'
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust targets
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Check format and targeted tests
        run: |
          cargo fmt --check
          cargo check --locked
          cargo test --locked
      - name: Build universal application
        run: bash scripts/bundle.sh universal
      - name: Archive application
        run: |
          lipo -info "dist/Kigi Windows.app/Contents/MacOS/kigi-windows"
          ditto -c -k --sequesterRsrc --keepParent "dist/Kigi Windows.app" dist/Kigi-Windows-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kigi-Windows-macOS-universal
          path: dist/Kigi-Windows-macOS-universal.zip
          if-no-files-found: error
          retention-days: 14
