name: Package macOS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/package-p0.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'resources/**'
      - 'scripts/**'
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust targets
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Check format and targeted tests
        run: |
          cargo fmt --check
          cargo check --locked
          cargo test --locked
      - name: Compile fixed Chrome script when Chrome is installed
        run: |
          if [[ -d "/Applications/Google Chrome.app" ]]; then
            osacompile -o "$RUNNER_TEMP/kigi-chatgpt.scpt" resources/chatgpt.applescript
          else
            echo "Chrome absent on runner: script compilation requires pilot Mac; no Chrome automation executed."
          fi
      - name: Build universal application
        run: bash scripts/bundle.sh universal
      - name: Verify native settings startup
        run: |
          python3 - <<'PYTHON'
          import subprocess, time
          app = subprocess.Popen(["dist/Kigi Windows.app/Contents/MacOS/kigi-windows"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          try:
              time.sleep(4)
              if app.poll() is not None:
                  raise RuntimeError("Kigi exited during settings startup: " + app.communicate()[0].decode(errors="replace"))
              print("Native process stayed alive through settings startup; no input, AX action or screenshot taken.")
          finally:
              if app.poll() is None:
                  app.terminate()
                  try:
                      app.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      app.kill()
                      app.wait()
          PYTHON
      - name: Archive application
        run: |
          lipo -info "dist/Kigi Windows.app/Contents/MacOS/kigi-windows"
          ditto -c -k --sequesterRsrc --keepParent "dist/Kigi Windows.app" dist/Kigi-Windows-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kigi-Windows-macOS-universal
          path: dist/Kigi-Windows-macOS-universal.zip
          if-no-files-found: error
          retention-days: 14
