<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Kigi Studio</title>
<link rel="stylesheet" href="styles.css">
<script src="bridge.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="shell">
<aside class="sidebar" aria-label="Navigation">
<div class="brand"><span class="brand-icon" aria-hidden="true">k</span><span>Kigi<span class="brand-sub">STUDIO</span></span></div>
<div class="nav-label">VOTRE ENVIRONNEMENT</div>
<nav id="navigation"></nav>
<div class="nav-label spaces-label">ESPACES ENREGISTRÉS</div>
<div id="spaces-list" class="space-list"></div>
<div class="sidebar-bottom"><button id="native" class="native-link">Réglages classiques <span aria-hidden="true">↗</span></button><span id="version" class="muted">Chargement…</span></div>
</aside>
<main>
<header class="topbar"><div class="breadcrumb">Studio <span aria-hidden="true">/</span> <span id="crumb">Accueil</span></div><div class="header-actions"><button id="restore-layout" class="subtle" hidden>Restaurer</button><button id="properties" class="subtle compact-only" aria-controls="inspector" aria-expanded="false">Propriétés</button><button id="refresh" class="subtle">Actualiser</button></div></header>
<div id="error" class="error" role="alert" hidden></div>
<section id="content" aria-labelledby="page-title" aria-busy="true"><div class="loading">Connexion au moteur local…</div></section>
<footer><span class="status-dot" aria-hidden="true"></span><span id="status" role="status">Lecture des données…</span><span class="local-label">Données locales</span></footer>
</main>
<aside id="inspector" class="inspector" aria-label="Propriétés"></aside>
</div>
<div id="modal" class="modal-overlay" hidden><section role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message" class="modal"><h2 id="modal-title"></h2><p id="modal-message"></p><div id="modal-actions"></div></section></div>
</body>
</html>
